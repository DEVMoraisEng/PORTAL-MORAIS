name: Descobrir medições de contrato no Mais Controle (só leitura)

# 23/10/26: levantamento para o Mapa de Obras mostrar as medições de TODOS os
# contratos em aberto de cada obra (mestre, pintor, eletricista…). Não grava nada
# no Mais Controle e não imprime valores — só caminhos de API e nomes de campos.
# O resultado vai para o ramo "robo-descobertas" (descoberta_medicoes.txt).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descobrir
        env:
          MC_ROBO_EMAIL: ${{ secrets.MC_ROBO_EMAIL || secrets.MC_ROBO_USUARIO }}
          MC_ROBO_SENHA: ${{ secrets.MC_ROBO_SENHA }}
          MC_ROBO_APARELHO: ${{ secrets.MC_ROBO_APARELHO }}
        run: |
          pip install --quiet requests
          python -u -m venda.mc.descobrir_medicoes > /tmp/descoberta_medicoes.txt 2>&1 || echo "(saiu com erro)" >> /tmp/descoberta_medicoes.txt
          tail -5 /tmp/descoberta_medicoes.txt
      - name: Guardar o resultado no ramo robo-descobertas
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin robo-descobertas || true
          if git rev-parse --verify origin/robo-descobertas >/dev/null 2>&1; then
            git checkout -B robo-descobertas origin/robo-descobertas
          else
            git checkout --orphan robo-descobertas && git rm -rf -q . || true
          fi
          cp /tmp/descoberta_medicoes.txt descoberta_medicoes.txt
          git add descoberta_medicoes.txt
          git commit -q -m "descoberta medições $(date -u +%FT%TZ)" || true
          git push -q origin robo-descobertas
