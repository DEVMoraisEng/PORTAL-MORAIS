name: Auditoria Financeira (madrugada)

# Roda 1x por dia às 04:23 de Brasília (07:23 UTC). A API para relatórios do
# Mais Controle atualiza os dados às 03:00 — rodar antes disso pegaria o dia
# anterior. Minuto 23 de propósito: topo de hora é o horário mais disputado do
# agendador do GitHub.
#
# Também roda:
#   - à mão: Actions > Auditoria Financeira > Run workflow
#   - pelo botão "Reprocessar agora" da aba Manual do portal (Apps Script manda
#     o repository_dispatch "auditoria_update" — se este bloco sair daqui, o
#     GitHub ignora o pedido sem dar erro nenhum).
on:
  schedule:
    - cron: '23 7 * * *'     # 04:23 de Brasília
    - cron: '41 9 * * *'     # 06:41 — RESERVA: só trabalha se a das 04:23 não rodou (o GitHub às vezes pula)
  workflow_dispatch:
  repository_dispatch:
    types: [auditoria_update]

permissions:
  contents: read

concurrency:
  group: auditoria-financeira
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas requests openpyxl

      - name: Rodar a auditoria
        env:
          # sem os MC_API_*, testa o login MC_ROBO_* (MC_USUARIO/MC_SENHA deu 401); se a API recusar, cai nas planilhas
          MC_API_USUARIO: ${{ secrets.MC_API_USUARIO || secrets.MC_ROBO_USUARIO }}
          MC_API_SENHA: ${{ secrets.MC_API_SENHA || secrets.MC_ROBO_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # se a API do MC falhar, usa as planilhas publicadas da Análise de Dados
          ERP_CSV_PAGAMENTOS: ${{ secrets.ERP_CSV_PAGAMENTOS }}
          ERP_CSV_OBRAS: ${{ secrets.ERP_CSV_OBRAS }}
          ERP_CSV_RECEBIMENTOS: ${{ secrets.ERP_CSV_RECEBIMENTOS }}
          SO_SE_FALTOU: ${{ github.event.schedule == '41 9 * * *' && '1' || '' }}
        run: python robo_auditoria_fin.py
