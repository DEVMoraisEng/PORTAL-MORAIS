<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#295778">
<link rel="manifest" href="manifest.json">
<title>Portal Central · Morais Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#295778;--azul-esc:#1e3f58;--teal:#8FDCD2;--verde:#2a9d5c;--verde-btn:#4cd964;--verde-esc:#1a6b40;
  --bg:#EAF1F3;--bg2:#F5F9FA;--bg3:#dceaef;--border:#b8d0da;--border2:#d0e4ec;
  --text:#1a3347;--text3:#5a8099;--text4:#8aacbb;--branco:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
.cond{font-family:'Barlow Condensed',Inter,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(120deg,var(--azul-esc),var(--azul));position:relative}
header::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--verde-btn),var(--teal))}
.hbar{display:flex;align-items:center;gap:13px;padding:14px 0;flex-wrap:wrap}
.logo{background:#fff;border-radius:9px;padding:5px 10px;display:inline-flex}.logo img{height:38px;display:block}
.htitle{font-family:'Barlow Condensed';font-weight:800;font-size:23px;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.hsub{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.hspace{flex:1}
.net{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px}
.net.on{background:rgba(76,217,100,.22);color:#CFF9DC}.net.off{background:rgba(255,180,120,.28);color:#FFE2C6}
.user{display:flex;align-items:center;gap:10px;color:#fff}.nome{font-weight:600;font-size:13.5px}
.badge{font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;text-transform:uppercase}.badge.adm{background:var(--verde-btn);color:#0c3f22}
.sair{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
main{padding:26px 20px 60px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.sec{display:flex;align-items:center;gap:10px;background:var(--bg3);border-left:4px solid var(--verde);border-radius:8px;padding:9px 14px;margin:0 0 15px}
.sec .cond{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--azul-esc)}
.bloco{margin-bottom:22px}

/* barra de sistemas — fundo azul, botões colados à esquerda */
.sysbar{background:linear-gradient(165deg,var(--azul-esc),#12293a);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;gap:9px;box-shadow:0 6px 18px rgba(20,45,60,.25)}
.sysbtn{position:relative;display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:13px 14px;text-decoration:none;cursor:pointer;color:#fff;background:rgba(255,255,255,.06);transition:background .15s,transform .1s;text-align:left;font:inherit;width:100%}
.sysbtn:hover{background:rgba(255,255,255,.14);transform:translateX(2px)}
.sysbtn .ico{width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--verde-btn);color:#0c3f22;font-family:'Barlow Condensed';font-weight:800;font-size:16px}
.sysbtn .txt{flex:1;min-width:0}
.sysbtn .nm{font-family:'Barlow Condensed';font-weight:800;font-size:14.5px;text-transform:uppercase;letter-spacing:.3px;line-height:1.15}
.sysbtn .d{font-size:10.5px;color:var(--teal);opacity:.9;margin-top:2px}
.sysbtn .cnt{background:#fff;color:var(--verde-esc);min-width:26px;height:26px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;padding:0 7px}
.sysbtn .cnt span{font-size:7px;text-transform:uppercase;letter-spacing:.3px;opacity:.8;font-weight:700;line-height:1}
.sysbar .vazio{background:transparent;border:1px dashed rgba(255,255,255,.28);color:rgba(255,255,255,.75)}
.vazio{background:#fff;border:1px dashed var(--border);border-radius:12px;padding:20px;color:var(--text3);text-align:center;font-size:13px}

/* KPIs — cartões emoldurados */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--border2);border-radius:12px;padding:15px 16px 14px}
.kpi .lab{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);font-weight:700}
.kpi .val{font-family:'Barlow Condensed';font-size:30px;font-weight:800;line-height:1;margin-top:8px;color:var(--azul-esc)}
.kpi .sub{font-size:11px;color:var(--text4);margin-top:6px}
.kpi.hero{background:linear-gradient(135deg,var(--azul),var(--azul-esc));border:0}
.kpi.hero .lab{color:rgba(255,255,255,.85)}.kpi.hero .val{color:#fff}.kpi.hero .sub{color:var(--teal)}
.kpi.verde .val{color:var(--verde-esc)}
.nota{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:16px;display:none}
.updated{color:var(--text4);font-size:11px;margin-top:8px;text-align:right}
.load{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <div class="wrap hbar">
      <span class="logo"><img src="img/logo.png" alt="Morais" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'"><b class="logo-fallback" style="display:none;font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:var(--azul-esc);padding:0 4px">MORAIS</b></span>
      <div><div class="htitle">Portal Central</div><div class="hsub">Morais Engenharia · Controle Interno</div></div>
      <div class="hspace"></div>
      <span class="net on" id="net-status">online</span>
      <div class="user"><div style="text-align:right"><div class="nome" id="u-nome">—</div><span class="badge" id="u-tipo">—</span></div><button class="sair" onclick="sair()">Sair</button></div>
    </div>
  </header>

  <main class="wrap">
    <div class="nota" id="nota"></div>
    <div class="grid">
      <section>
        <div class="sec"><span class="cond">Sistemas</span></div>
        <div class="sysbar" id="cards"><div class="vazio"><span class="load"></span> Carregando…</div></div>
      </section>
      <section>
        <div class="bloco"><div class="sec"><span class="cond">Venda de Casas</span></div><div class="kpis" id="kpi-vendas"><div class="kpi"><div class="lab">Carregando</div><div class="val"><span class="load"></span></div></div></div></div>
        <div class="bloco"><div class="sec"><span class="cond">Início de Obras</span></div><div class="kpis" id="kpi-obras"></div></div>
        <div class="bloco"><div class="sec"><span class="cond">Lotes Comprados</span></div><div class="kpis" id="kpi-lotes"></div></div>
        <div class="updated" id="updated"></div>
      </section>
    </div>
  </main>

<script src="app.js"></script>
<script>
const SISTEMAS=[{chave:"VENDAS",nome:"Gestão de Vendas",desc:"Atividades, alertas e planilhas",ico:"V",link:"vendas.html",conta:true}];
let S=exigirSessao(); atualizarStatus();

function pintarUsuario(s){ document.getElementById("u-nome").textContent=s.nome||s.login; const tb=document.getElementById("u-tipo"); tb.textContent=s.tipo; tb.className="badge"+(s.tipo==="ADM"?" adm":""); }
function renderCards(s){
  const vis=SISTEMAS.filter(x=>podeAcessar(s,x.chave)); const box=document.getElementById("cards");
  box.innerHTML=vis.length?vis.map(x=>`<a class="sysbtn" href="${x.link}"><div class="ico">${x.ico}</div><div class="txt"><div class="nm">${esc(x.nome)}</div><div class="d">${esc(x.desc)}</div></div>${x.conta?`<div class="cnt"><b id="cnt-${x.chave}">·</b><span>aberto</span></div>`:``}</a>`).join(""):'<div class="vazio">Sem sistemas liberados. Fale com o ADM.</div>';
}
function card(lab,val,sub,cls){ return `<div class="kpi ${cls||''}"><div class="lab">${lab}</div><div class="val">${val}</div><div class="sub">${sub||''}</div></div>`; }

async function boot(){
  pintarUsuario(S); renderCards(S); // primeiro pinta com o que já tem em cache local, sem esperar rede
  // atualiza tipo/acessos direto do servidor — sem isso, um acesso liberado agora
  // no Notion só apareceria depois que a pessoa deslogasse e logasse de novo
  S=await sincronizarSessao();
  pintarUsuario(S); renderCards(S);
  // dispara tudo em paralelo (KPIs e contagem de atividades) — antes era sequencial e demorava mais
  const [kpiR, atvR]=await Promise.all([ ler({action:"portal"},"portal"), ler({action:"atividades"},"atividades") ]);
  pintarAtividades(atvR); pintarKpis(kpiR);
}
function pintarAtividades(r){ const el=document.getElementById("cnt-VENDAS"); if(el&&r&&r.ok)el.textContent=r.total; }
function pintarKpis(r){
  if(!r.ok){ document.getElementById("kpi-vendas").innerHTML=card("Indisponível","—",erroTexto(r.erro)); return; }
  const vc=r.vendaCasas, io=r.inicioObras, lo=r.lotes;
  document.getElementById("kpi-vendas").innerHTML=
    card("Casas Vendidas",num(vc.total),"com data de venda","hero")+
    card("VGV (Contratos)",brl(vc.vgv),"soma dos contratos","verde")+
    card("Média/mês",(vc.mediaMes||0).toLocaleString("pt-BR",{maximumFractionDigits:1}),vc.meses+" meses")+
    card("Ticket Médio",brl(vc.ticket),"por casa");
  document.getElementById("kpi-obras").innerHTML=
    card("Casas Iniciadas",num(io.iniciadas),"morais + investidores","hero")+
    card("Média/mês",(io.mediaMes||0).toLocaleString("pt-BR",{maximumFractionDigits:1}),io.meses+" meses")+
    card("Meta "+r.ano,num(io.meta),"casas no ano")+
    card("% da Meta",((io.pct||0)*100).toLocaleString("pt-BR",{maximumFractionDigits:0})+"%","iniciadas ÷ meta","verde");
  document.getElementById("kpi-lotes").innerHTML=card("Lotes Comprados",num(lo.total),"morais + investidores","hero");
  const nota=document.getElementById("nota");
  if(r.offline){ nota.style.display="block"; nota.textContent="Sem internet — últimos dados salvos ("+new Date(r._ts).toLocaleString("pt-BR")+")."; } else nota.style.display="none";
  document.getElementById("updated").textContent="Custos (ERP) entram na próxima etapa. Atualizado: "+new Date().toLocaleString("pt-BR");
}
window.aoSincronizar=async()=>{ pintarAtividades(await ler({action:"atividades"},"atividades")); };
boot();
</script>
</body>
</html>
