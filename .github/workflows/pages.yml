name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cron de segurança, e SÓ isso. Quem manda republicar de verdade agora é o
  # acionador publicarSite do Apps Script, de 30 em 30 min.
  #
  # POR QUE MUDOU: o agendamento do GitHub Actions é entrega de melhor
  # esforço. Sob carga ele atrasa e chega a pular execuções — o pedido de
  # 15 min estava virando 2 a 4 HORAS na prática (dá para ver no histórico de
  # execuções). Pedir 30 em vez de 15 não conserta isso; o problema não é o
  # número. Por isso o intervalo confiável passou para o Apps Script, cujo
  # acionador é o mesmo que roda o aquecerCaches sem falhar, e aqui fica um
  # cron esparso só para o caso de o Apps Script estar fora do ar.
  #
  # Minuto 11 e 41 de propósito: topo de hora é o horário mais concorrido do
  # agendador do GitHub, e é onde o atraso é pior.
  schedule:
    - cron: '11,41 * * * *'
  # Disparo vindo do Apps Script depois de uma escrita.
  # ATENÇÃO: se este bloco sair daqui, o repository_dispatch é ignorado
  # silenciosamente pelo GitHub (sem erro nenhum).
  repository_dispatch:
    types: [portal_update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Gera dist/*.json lendo o Notion. É isto que deixa o site rápido:
      # o navegador baixa JSON pronto em vez de esperar o Apps Script.
      - name: Buscar dados do Notion
        env:
          # Único secret necessário. Os IDs das bases ficam fixos no
          # fetch_vendas.py — ID do Notion não é credencial.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python fetch_vendas.py

      # Gera dist/pos_obra.json (obras, calendário e schema do Pós Obra).
      # Step SEPARADO de propósito: se a leitura do Pós Obra falhar, o
      # vendas.json e o ligacoes.json já foram gravados no step anterior e o
      # site publica do mesmo jeito — só a tela de Pós Obra cai no caminho
      # antigo (Apps Script) até a próxima rodada.
      - name: Buscar dados do Pós Obra
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python fetch_pos_obra.py

      # Gera dist/docs.json (base DOCUMENTOS + atividades de documentação).
      # Step SEPARADO pelo mesmo motivo do Pós Obra: se a leitura desta base
      # falhar, o que os steps anteriores já gravaram continua sendo publicado
      # e só a tela de Gestão de Documentos fica com o arquivo da rodada
      # anterior.
      - name: Buscar dados de Documentos
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python fetch_documentos.py

      # ANÁLISE DE DADOS (veio do repositório CONTROLES-INTERNOS). NÃO gera
      # nada no dist/: grava no Supabase Storage (bucket privado "analise") e a tela lê
      # pelo Apps Script, com login — mesmo desenho do Orçado x Realizado.
      # continue-on-error: a planilha do ERP fora do ar não pode derrubar o
      # build do portal inteiro.
      - name: Buscar dados da Análise de Dados
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ERP_CSV_PROPOSTAS: ${{ secrets.ERP_CSV_PROPOSTAS }}
          ERP_CSV_PAGAMENTOS: ${{ secrets.ERP_CSV_PAGAMENTOS }}
          ERP_CSV_OBRAS: ${{ secrets.ERP_CSV_OBRAS }}
          ERP_CSV_RECEBIMENTOS: ${{ secrets.ERP_CSV_RECEBIMENTOS }}
        run: pip install requests && python fetch_analise_dados.py

      # ABA DE OBRAS — gera dist/obras.json (obras + atividades de projetos,
      # sem CPF/CNPJ, nascimento e conta). A integração do Notion precisa
      # estar conectada à ATIVIDADES DE PROJETOS.
      - name: Buscar dados das Obras
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ERP_CSV_OBRAS: ${{ secrets.ERP_CSV_OBRAS }}
        run: pip install requests && python fetch_obras.py

      # ESPELHO DOS ANEXOS DAS LIGAÇÕES (23/09/26). Copia NF MEDIDOR e demais
      # anexos para o bucket PRIVADO "anexos" do Supabase — é o que faz o PDF
      # abrir em 1-2 s pelo portal (ação ligArquivo do Melhorias.gs). Só sobe o
      # que é novo; nada disso vai para o dist/. Falhar aqui não derruba o site.
      - name: Espelhar anexos das Ligações
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: pip install requests && python espelhar_anexos.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (raiz do repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
