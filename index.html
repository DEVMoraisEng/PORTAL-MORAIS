<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#295778">
<!-- tema antes da pintura: sem isto a tela pisca branca pra quem usa escuro -->
<script>(function(){try{var t=localStorage.getItem("morais_tema");
  if(t!=="claro"&&t!=="escuro") t="claro";   // padrão do portal: CLARO
  document.documentElement.dataset.tema=t;}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<title>Portal Central · Morais Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema claro fixo. Sem isto, o Android/iOS em modo escuro inverte controles
   nativos (inputs, selects, datas, scrollbar) e o site fica com campos pretos
   sobre o layout claro. "light only" recusa a inversão em vez de só sugerir. */
:root{color-scheme:light}
/* O fundo do body só cobre a altura do conteúdo. Sem repetir a cor aqui,
   o resto da tela cai no branco do html — foi o que deixou a faixa branca
   embaixo em páginas curtas. min-height garante a tela toda. */
html{background:var(--bg);min-height:100%}
body{min-height:100vh}

:root{
  --azul:#295778;--azul-esc:#1e3f58;--teal:#8FDCD2;--verde:#2a9d5c;--verde-btn:#4cd964;--verde-esc:#1a6b40;
  --bg:#EAF1F3;--bg2:#F5F9FA;--bg3:#dceaef;--border:#b8d0da;--border2:#d0e4ec;
  --text:#1a3347;--text3:#5a8099;--text4:#8aacbb;--branco:#fff;
  --sup:#fff}   /* superfície dos cartões — o modo escuro troca só isto */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
.cond{font-family:'Barlow Condensed',Inter,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(120deg,var(--azul-esc),var(--azul));position:relative}
header::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--verde-btn),var(--teal))}
.hbar{display:flex;align-items:center;gap:13px;padding:14px 0;flex-wrap:wrap}
.logo{background:#fff;border-radius:9px;padding:5px 10px;display:inline-flex}.logo img{height:38px;display:block}
.htitle{font-family:'Barlow Condensed';font-weight:800;font-size:23px;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.hsub{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.hspace{flex:1}
.net{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px}
.net.on{background:rgba(76,217,100,.22);color:#CFF9DC}.net.off{background:rgba(255,180,120,.28);color:#FFE2C6}
.user{display:flex;align-items:center;gap:10px;color:#fff}.nome{font-weight:600;font-size:13.5px}
.badge{font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;text-transform:uppercase}.badge.adm{background:var(--verde-btn);color:#0c3f22}
.sair{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
/* (o bloco de tela estreita que ficava aqui foi para o FIM do arquivo: aqui em
   cima ele vinha ANTES das regras de .shell/.dash-nav/.nav-btn e perdia para
   elas — por isso, no celular, o menu continuava sendo uma coluna de 220px e
   cada botão nascia com 180px de ALTURA, por causa do flex:1 1 180px caindo
   num container em coluna.) */
.sec{display:flex;align-items:center;gap:10px;background:var(--bg3);border-left:4px solid var(--verde);border-radius:8px;padding:9px 14px;margin:0 0 15px}
.sec .cond{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--azul-esc)}
.bloco{margin-bottom:22px}

/* layout com coluna lateral de altura total — igual ao analise.html */
body{display:flex;flex-direction:column;min-height:100vh}
.shell{flex:1;display:flex;min-height:0}
.dash-nav{width:220px;flex-shrink:0;background:var(--azul-esc);border-right:2px solid rgba(143,220,210,.2);
  display:flex;flex-direction:column;padding:24px 14px;gap:8px}
.nav-btn{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;
  font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:.09em;
  text-transform:uppercase;text-align:left;cursor:pointer;border:2px solid rgba(76,217,100,.55);
  border-radius:8px;background:var(--verde);transition:all .18s;line-height:1.2;text-decoration:none;font-family:'Barlow Condensed'}
.nav-btn:hover{background:var(--verde-btn);border-color:var(--verde-btn);color:#0c3f22}
.nav-btn .cnt{margin-left:auto;background:#c0392b;color:#fff;min-width:24px;height:22px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;padding:0 7px}
/* item 2: rótulo de seção (SETORES / REUNIÕES) dentro da barra lateral escura */
.nav-grupo{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:800;color:var(--teal);
  letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin:14px 4px 2px;padding-top:12px;
  border-top:1px solid rgba(143,220,210,.18)}
.nav-grupo:first-child{margin-top:0;padding-top:0;border-top:0}
.dash-main{flex:1;min-width:0;padding:24px 28px 40px;overflow-y:auto}
.dash-nav .vazio{background:transparent;border:1px dashed rgba(255,255,255,.28);color:rgba(255,255,255,.75);padding:14px;font-size:12px}
.vazio{background:var(--sup);border:1px dashed var(--border);border-radius:12px;padding:20px;color:var(--text3);text-align:center;font-size:13px}

/* KPIs — cartões emoldurados */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--sup);border:1px solid var(--border2);border-radius:12px;padding:15px 16px 14px}
.kpi .lab{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);font-weight:700}
.kpi .val{font-family:'Barlow Condensed';font-size:30px;font-weight:800;line-height:1;margin-top:8px;color:var(--azul-esc)}
.kpi .sub{font-size:11px;color:var(--text4);margin-top:6px}
.kpi.hero{background:linear-gradient(135deg,var(--azul),var(--azul-esc));border:0}
.kpi.hero .lab{color:rgba(255,255,255,.85)}.kpi.hero .val{color:#fff}.kpi.hero .sub{color:var(--teal)}
.kpi.verde .val{color:var(--verde-esc)}

/* ---------- META EM DESTAQUE ----------
   Antes a meta ia junto do subtítulo miúdo cinza (11px), do mesmo tamanho de
   "8 meses decorridos" — ou seja, a informação mais importante do cartão
   tinha o mesmo peso visual do rodapé dele. Agora vira barra + percentual
   grande e colorido: dá pra ler o cartão de longe e saber se está no azul
   ou no vermelho sem precisar interpretar número nenhum. */
.mbar{height:7px;border-radius:20px;background:var(--bg3);margin-top:11px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:20px;background:var(--verde);transition:width .45s ease}
.mbar i.medio{background:#E67E22}
.mbar i.baixo{background:#c0392b}
.msub{display:flex;align-items:baseline;gap:7px;margin-top:8px;flex-wrap:wrap}
.msub .pct{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;line-height:1}
.msub .txt{font-size:12px;color:var(--text3);font-weight:600}
.pct.ok{color:var(--verde-esc)}.pct.medio{color:#c9741a}.pct.baixo{color:#c0392b}
/* no cartão escuro (hero) as mesmas cores não teriam contraste */
.kpi.hero .mbar{background:rgba(255,255,255,.20)}
.kpi.hero .msub .txt{color:var(--teal)}
.kpi.hero .pct.ok{color:#8ce0a5}.kpi.hero .pct.medio{color:#f0c95f}.kpi.hero .pct.baixo{color:#f3a29a}
html[data-tema="escuro"] .pct.ok{color:#8ce0a5}
html[data-tema="escuro"] .pct.medio{color:#f0c95f}
html[data-tema="escuro"] .pct.baixo{color:#f3a29a}
html[data-tema="escuro"] .mbar{background:#22323f}

/* ---------- comparação com o mês anterior ---------- */
.kpi .ant{display:flex;align-items:baseline;gap:6px;margin-top:7px;font-size:12px;color:var(--text3);font-weight:600}
.kpi .delta{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;line-height:1}
.delta.sobe{color:var(--verde-esc)}.delta.desce{color:#c0392b}.delta.igual{color:var(--text4)}
.kpi.hero .ant{color:var(--teal)}
.kpi.hero .delta.sobe{color:#8ce0a5}.kpi.hero .delta.desce{color:#f3a29a}
html[data-tema="escuro"] .delta.sobe{color:#8ce0a5}
html[data-tema="escuro"] .delta.desce{color:#f3a29a}

/* ---------- LEVANTAMENTO TRIMESTRAL (os 4 trimestres do ano) ----------
   Antes existia um cartão só, do trimestre corrente. Com os quatro lado a
   lado dá pra ver a curva do ano inteiro sem abrir o gráfico. */
.tri-wrap{margin-top:15px}
.tri-tit{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;
  text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:9px}
.tri-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.tri{background:var(--sup);border:1px solid var(--border2);border-radius:11px;padding:13px 14px}
.tri.corrente{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde) inset}
.tri.futuro{opacity:.5}
.tri-lab{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tri-lab .agora{background:var(--verde);color:#fff;border-radius:4px;padding:1px 6px;
  font-size:9.5px;letter-spacing:.04em}
.tri-val{font-family:'Barlow Condensed',sans-serif;font-size:33px;font-weight:800;
  line-height:1.05;color:var(--azul-esc);margin-top:4px}
.tri .mbar{margin-top:9px}
.tri .msub{margin-top:6px}
.tri .msub .pct{font-size:17px}
.tri .msub .txt{font-size:11px}
.tri-nota{font-size:11px;color:var(--text4);font-weight:600;margin-top:7px}
html[data-tema="escuro"] .tri-val{color:var(--teal)}
@media(max-width:900px){ .tri-grid{grid-template-columns:repeat(2,1fr)} }
@media(max-width:440px){ .tri-grid{grid-template-columns:1fr} }
.nota{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:16px;display:none}
.updated{color:var(--text4);font-size:11px;margin-top:8px;text-align:right}
/* Hora da última publicação, no cabeçalho de todas as páginas. No rodapé ela
   existia mas ficava depois de uma tela inteira de conteúdo — na prática
   ninguém via. Aqui fica sempre à vista. No celular some (o cabeçalho já é
   apertado) e a cópia do rodapé cobre. */
.hupd{font-size:10.5px;color:rgba(255,255,255,.72);white-space:nowrap;
  text-align:right;margin:0;line-height:1.2;max-width:210px}
@media(max-width:900px){ .hupd{display:none} }

.load{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-btn .ext{font-size:11px;opacity:.65;margin-left:2px}

/* ---------- bloco recolhível com o gráfico de evolução ----------
   Fica FECHADO por padrão (pedido): o dashboard abre com os números e quem
   quiser o histórico expande. O conteúdo não é renderizado até a primeira
   abertura — desenhar três gráficos que ninguém olhou só atrasaria a tela. */
.sec{justify-content:space-between}
.bt-graf{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:transparent;
  border:1px solid var(--border);color:var(--text3);border-radius:7px;padding:5px 11px;
  font:inherit;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.bt-graf:hover{background:var(--sup);color:var(--azul-esc)}
.bt-graf .seta{display:inline-block;transition:transform .18s;font-size:10px}
.bt-graf[aria-expanded="true"] .seta{transform:rotate(90deg)}
.graf-box{display:none;background:var(--sup);border:1px solid var(--border2);border-radius:12px;
  padding:14px 16px 10px;margin-top:13px}
.graf-box.aberto{display:block}
.graf-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.graf-tit{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;color:var(--azul-esc)}
.graf-box select{margin-left:auto;padding:5px 9px;border:1px solid var(--border);border-radius:7px;
  background:var(--sup);color:var(--text);font:inherit;font-size:12.5px}
.graf-svg{width:100%;height:auto;display:block;overflow:visible}
.graf-leg{display:flex;gap:15px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--text3)}
.graf-leg i{display:inline-block;width:16px;height:0;border-top:2px solid currentColor;
  vertical-align:middle;margin-right:5px}
.graf-leg .bloco-cor{display:inline-block;width:11px;height:11px;border-radius:2px;
  vertical-align:-1px;margin-right:5px}
.graf-vazio{padding:22px;text-align:center;color:var(--text4);font-size:12.5px}
@media(max-width:680px){ .graf-box{padding:12px 10px 8px} .graf-box select{margin-left:0} }

html[data-tema="escuro"] .graf-tit{color:var(--teal)}
html[data-tema="escuro"] .bt-graf:hover{color:var(--teal)}

/* ==================== TELA ESTREITA / CELULAR ====================
   Tem que ficar no FIM: as regras do menu lateral aparecem lá em cima e, com a
   mesma especificidade, ganha a última. */
@media(max-width:820px){
  /* o menu deixa de ser coluna lateral e vira uma faixa de botões no topo */
  .shell{flex-direction:column}
  .dash-nav{width:100%;flex-direction:row;flex-wrap:wrap;border-right:0;
    border-bottom:2px solid rgba(143,220,210,.2);padding:14px;gap:9px}
  .nav-btn{width:auto;flex:1 1 200px;min-height:52px}
  .nav-grupo{flex-basis:100%;margin:6px 4px 0}
  .dash-main{padding:18px 14px 34px}
}
@media(max-width:680px){
  input,select,textarea{font-size:16px}
  /* cabeçalho compacto: no celular ele tomava um terço da tela */
  .hbar{gap:9px;padding:10px 0;flex-wrap:nowrap}
  .wrap{padding:0 12px}
  .logo{padding:4px 7px}.logo img{height:26px}
  .htitle{font-size:15px;line-height:1.05}
  .hsub{display:none}
  .net{display:none}
  .user{gap:7px;margin-left:auto}
  .user .nome{display:none}
  .sair{padding:8px 10px;font-size:12px;min-height:40px}
  .dash-nav{padding:12px;gap:8px}
  .nav-btn{flex:1 1 100%;min-height:48px;font-size:14px;padding:12px 14px}
  .kpis{grid-template-columns:1fr}
  .sec{padding:8px 11px}
  .sec .cond{font-size:15px}
  .bloco{margin-bottom:16px}
}

/* ===================== MODO ESCURO =====================
   Mesma paleta do ligacoes.html e a MESMA chave no navegador (morais_tema):
   quem escolhe escuro numa página encontra a outra já escura. */
html[data-tema="escuro"]{
  color-scheme:dark;
  --azul:#2f6e93;--azul-esc:#122430;--teal:#79c8bf;--verde:#2f9e63;--verde-btn:#3cbf5d;--verde-esc:#17603a;
  --bg:#0e1920;--bg2:#15222c;--bg3:#1a2c38;--border:#2d4757;--border2:#243a4a;
  --text:#e7eff5;--text3:#9db4c4;--text4:#7794a6;--branco:#15222c;--sup:#15222c;
}
html[data-tema="escuro"] body{background:var(--bg)}
html[data-tema="escuro"] .sec .cond,
html[data-tema="escuro"] .kpi .val{color:var(--teal)}
html[data-tema="escuro"] .kpi.hero .val{color:#fff}
html[data-tema="escuro"] .nota{background:#2a2113;border-color:#57431f;color:#f0c95f}
html[data-tema="escuro"] .logo{background:#fff}
.btema{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;
  padding:6px 10px;font:inherit;font-size:15px;line-height:1;cursor:pointer}
.btema:hover{background:rgba(255,255,255,.22)}
</style>
</head>
<body>
  <header>
    <div class="wrap hbar">
      <span class="logo"><img src="img/logo.png" alt="Morais" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'"><b class="logo-fallback" style="display:none;font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:var(--azul-esc);padding:0 4px">MORAIS</b></span>
      <div><div class="htitle">Portal Central</div><div class="hsub">Morais Engenharia · Controle Interno</div></div>
      <div class="hspace"></div>

    </div>

  <div class="shell">

<script src="app.js?v=28"></script>
<script>
/* claro/escuro — a escolha vale só para quem clicou, no navegador dele */
const TEMA_KEY = "morais_tema";
function temaAtual(){ return document.documentElement.dataset.tema === "escuro" ? "escuro" : "claro"; }
function aplicarTema(t){
  const escuro = (t === "escuro");
  document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
  const b = document.getElementById("btema");
  if (b){ b.textContent = escuro ? "☀" : "🌙";
          b.title = escuro ? "Voltar para o tema claro" : "Mudar para o tema escuro"; }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", escuro ? "#122430" : "#295778");
}
function trocarTema(){
  const novo = temaAtual() === "escuro" ? "claro" : "escuro";
  try { localStorage.setItem(TEMA_KEY, novo); } catch(e){}
  aplicarTema(novo);
}
document.addEventListener("DOMContentLoaded", () => aplicarTema(temaAtual()));
</script>
<script>
/* "chave" tem que bater com o valor na coluna ACESSOS do banco LOGINS.
   externo:true = mora em outro repositório/site; o card só abre o link, e o
   controle de acesso do portal NÃO protege a página de destino (ver
   CONFIGURAR.md, seção "RAS").
   "grupo" decide em que bloco da barra lateral o botão cai — a ORDEM dos
   blocos é fixa (ver GRUPOS_ORDEM), não a ordem aqui no array. */
const SISTEMAS=[
  {chave:"VENDAS",nome:"Gestão de Vendas",desc:"Atividades, alertas e planilhas",ico:"V",link:"vendas.html",conta:true,grupo:"SETORES"},
  /* "LIGAÇÕES" tem que ser IGUAL à opção da coluna ACESSOS no banco LOGINS —
     com acento e em maiúsculas. Se não bater, o botão simplesmente não
     aparece pra quem tem o acesso, e sem mensagem de erro nenhuma. */

/* ======================= NÚMEROS E METAS =======================
   REGRA DAS MÉDIAS (combinada):
     média/mês       = total do ano ÷ MESES DECORRIDOS (não ÷ meses que tiveram
                       movimento — contar só os meses com venda escondia os
                       zerados e inflava a média)
     média/trimestre = total do trimestre ATUAL ÷ 3 meses
     meta mensal     = meta do ano ÷ 12   (comparável com as duas médias acima)
     meta trimestral = meta do ano ÷ 4
   Os dois vêm prontos do portal.json (fetch_vendas.py) — aqui é só exibição. */

/* Meta de CASAS VENDIDAS: o analise.html usa a meta do ano ANTERIOR (a lógica
   é que o que se vende hoje foi iniciado no ano passado). Deixei ligado porque
   é o que já está em uso lá, mas isto ficou SEM confirmação sua — se a meta de
   venda tiver que ser a do próprio ano, troque para false e republique.
   Início de obras e lotes usam sempre a meta do ano corrente. */
const META_VENDAS_ANO_ANTERIOR = true;

const MESES_ABREV=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESES_NOME=["janeiro","fevereiro","março","abril","maio","junho","julho",
                  "agosto","setembro","outubro","novembro","dezembro"];
const dec = (v,c) => (Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:c==null?1:c});
/* Faixa de desempenho — decide a cor da barra e do percentual.
   Três faixas em vez de duas (só verde/vermelho): sem o laranja, quem está a
   5% de bater a meta ficava pintado igual a quem está na metade dela. */
function faixaMeta(pct){ return pct>=100?"ok" : pct>=80?"medio" : "baixo"; }

/* Cartão com meta: valor grande + barra de progresso + percentual em destaque.
   `extra` é o texto pequeno que acompanha (ex.: o rótulo do trimestre).
   SEM meta cadastrada não inventa comparação: some a barra e o percentual, e
   fica só o aviso — melhor um cartão sem meta do que um 0% que parece
   desempenho ruim quando na verdade é meta não preenchida no Notion. */
function cardMeta(lab,val,valor,meta,extra,cls){
  /* Valor indisponível (ex.: média em janeiro, quando nenhum mês fechou ainda)
     não vira 0%. Um "0% da meta" em vermelho diz que o desempenho foi péssimo;
     o certo é dizer que ainda não dá pra medir. */
  if(valor==null){
    return card(lab,val,extra||"sem base de cálculo ainda",cls);
  }
  if(!meta){
    return card(lab,val,(extra?extra+" · ":"")+"sem meta cadastrada",cls);
  }
  const pct=(Number(valor)||0)/meta*100;
  const f=faixaMeta(pct);
  const larg=Math.max(2,Math.min(100,pct));   // 2% mínimo: barra zerada some
  return `<div class="kpi ${cls||''}">
    <div class="lab">${lab}</div>
    <div class="val">${val}</div>
    <div class="mbar"><i class="${f}" style="width:${larg.toFixed(1)}%"></i></div>
    <div class="msub"><b class="pct ${f}">${dec(pct,0)}%</b>
      <span class="txt">de ${dec(meta)}${extra?" · "+extra:""}</span></div>
  </div>`;
}

/* ======================= GRÁFICO DE EVOLUÇÃO =======================
   SVG montado à mão, sem biblioteca: são 12 barras e duas linhas. Puxar
   Chart.js para isso custaria mais download do que a página inteira.
   Barras = mês a mês; linha tracejada = meta mensal; pontilhada = média real
   do ano exibido. Mesma leitura dos gráficos do analise.html. */
function graficoSVG(valores, opts){
  opts=opts||{};
  const L=46, R=14, T=16, B=26, W=680, H=210;      // margens e área útil
  const gw=W-L-R, gh=H-T-B;
  const vals=(valores||[]).map(v=>Number(v)||0);
  const meta=opts.meta||0;
  const media=opts.media||0;
  const topo=Math.max(...vals, meta, media, 1)*1.15;
  const y=v=>T+gh-(v/topo)*gh;
  const passo=gw/12, larg=Math.min(passo*0.62, 34);
  const fmt=opts.fmt||(v=>dec(v));

  // linhas-guia horizontais (4 faixas) — dão referência sem poluir
  let grade="";
  for(let i=0;i<=4;i++){
    const v=topo*i/4, yy=y(v);
    grade+=`<line x1="${L}" y1="${yy.toFixed(1)}" x2="${L+gw}" y2="${yy.toFixed(1)}" stroke="var(--border2)" stroke-width="1"/>`;
    grade+=`<text x="${L-7}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text4)">${fmt(v)}</text>`;
  }
  let barras="";
  vals.forEach((v,i)=>{
    const cx=L+passo*i+passo/2, alt=Math.max(0,T+gh-y(v));
    if(v>0){
      barras+=`<rect x="${(cx-larg/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${larg.toFixed(1)}" height="${alt.toFixed(1)}" rx="3" fill="var(--azul)"><title>${MESES_NOME[i]}: ${fmt(v)}</title></rect>`;
      barras+=`<text x="${cx.toFixed(1)}" y="${(y(v)-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text3)">${fmt(v)}</text>`;
    }
    barras+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text4)">${MESES_ABREV[i]}</text>`;
  });
  let linhas="";
  if(meta>0) linhas+=`<line x1="${L}" y1="${y(meta).toFixed(1)}" x2="${L+gw}" y2="${y(meta).toFixed(1)}" stroke="var(--verde-esc)" stroke-width="2" stroke-dasharray="9 5"/>`;
  if(media>0) linhas+=`<line x1="${L}" y1="${y(media).toFixed(1)}" x2="${L+gw}" y2="${y(media).toFixed(1)}" stroke="var(--text3)" stroke-width="1.5" stroke-dasharray="2 4"/>`;

  return `<svg class="graf-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução mensal">${grade}${barras}${linhas}</svg>`;
}

/* Cartão "mês corrente + mês anterior embaixo" (itens 3 e 4 do pedido).
   O número do mês em curso, sozinho, não diz nada — 11 é bom ou ruim? Só com
   o mês anterior do lado é que vira informação. A seta é só o sinal da
   diferença; o mês corrente está incompleto, então NÃO entra em média nenhuma
   (ver mesesCheios), aqui é comparação bruta mesmo. */
function cardMes(lab,valor,anterior,nomeAnterior,fmt,cls){
  fmt = fmt || (v=>dec(v,0));
  const a=Number(valor)||0, b=Number(anterior)||0;
  const d=a-b;
  const f = d>0?"sobe" : d<0?"desce" : "igual";
  const seta = d>0?"▲" : d<0?"▼" : "=";
  const sinal = d>0?"+":"";
  return `<div class="kpi ${cls||''}">
    <div class="lab">${lab}</div>
    <div class="val">${fmt(a)}</div>
    <div class="ant"><b class="delta ${f}">${seta} ${sinal}${fmt(Math.abs(d))}</b>
      <span>vs ${esc(nomeAnterior||"mês anterior")}: ${fmt(b)}</span></div>
  </div>`;
}

/* Os QUATRO trimestres do ano (item 2 do pedido), no lugar do cartão único do
   trimestre corrente. "total" é a contagem cheia do trimestre; a média e o
   percentual usam só os meses FECHADOS — trimestre em andamento com um mês
   só teria média enganosa se contasse o mês pela metade. */
function faixaTrimestral(tris, metaMes, ano, unidade){
  if(!tris || !tris.length) return "";
  const cel = t => {
    const cls = t.futuro?"futuro":(t.corrente?"corrente":"");
    let barra="", sub="";
    if(t.media==null){
      sub = `<div class="tri-nota">${t.futuro?"ainda não começou":"sem movimento"}</div>`;
    }else if(metaMes){
      const pct=t.media/metaMes*100, f=faixaMeta(pct);
      barra=`<div class="mbar"><i class="${f}" style="width:${Math.max(2,Math.min(100,pct)).toFixed(1)}%"></i></div>`;
      sub=`<div class="msub"><b class="pct ${f}">${dec(pct,0)}%</b>
             <span class="txt">${dec(t.media)}/mês de ${dec(metaMes)}${t.corrente?" · mês em curso incluído":""}</span></div>`;
    }else{
      sub=`<div class="tri-nota">média ${dec(t.media)} por mês</div>`;
    }
    return `<div class="tri ${cls}">
      <div class="tri-lab">T${t.n} · ${esc(t.rotulo)}${t.corrente?'<span class="agora">agora</span>':''}</div>
      <div class="tri-val">${dec(t.total,0)}</div>${barra}${sub}</div>`;
  };
  return `<div class="tri-tit">Levantamento trimestral · ${ano}${unidade?" · "+esc(unidade):""}</div>
          <div class="tri-grid">${tris.map(cel).join("")}</div>`;
}

/* Estado dos três gráficos: qual está aberto e que ano cada um mostra. */
const GRAF={vendas:{aberto:false,ano:null},obras:{aberto:false,ano:null},lotes:{aberto:false,ano:null}};
const GRAF_CFG={
  vendas:{serie:"vendas", titulo:"Casas vendidas por mês", comMeta:true,  fmt:v=>dec(v,0)},
  obras: {serie:"obras",  titulo:"Casas iniciadas por mês", comMeta:true, fmt:v=>dec(v)},
  lotes: {serie:"lotes",  titulo:"Lotes adquiridos por mês", comMeta:false,fmt:v=>dec(v,0)}
};
let PORTAL=null;   // último portal.json pintado (o gráfico lê daqui)

function alternarGrafico(qual){
  const g=GRAF[qual]; g.aberto=!g.aberto;
  document.getElementById("g-"+qual).classList.toggle("aberto",g.aberto);
  document.getElementById("bt-g-"+qual).setAttribute("aria-expanded",g.aberto?"true":"false");
  if(g.aberto) desenharGrafico(qual);
}
function trocarAnoGrafico(qual,ano){ GRAF[qual].ano=Number(ano); desenharGrafico(qual); }

function desenharGrafico(qual){
  const box=document.getElementById("g-"+qual); if(!box) return;
  const cfg=GRAF_CFG[qual];
  if(!PORTAL||!PORTAL.ok||!PORTAL.series){
    box.innerHTML='<div class="graf-vazio">Sem dados publicados ainda — rode o workflow “Publicar site” no GitHub.</div>';
    return;
  }
  const serie=PORTAL.series[cfg.serie]||{};
  // anos com movimento neste indicador; se não houver nenhum, cai no ano atual
  const anos=Object.keys(serie).filter(a=>(serie[a]||[]).some(v=>v>0)).map(Number).sort((a,b)=>b-a);
  if(!anos.length) anos.push(PORTAL.ano);
  if(GRAF[qual].ano==null || anos.indexOf(GRAF[qual].ano)<0) GRAF[qual].ano=anos[0];
  const ano=GRAF[qual].ano;
  const vals=serie[String(ano)]||new Array(12).fill(0);

  // meta mensal do ano EXIBIDO (não do ano corrente) — senão, olhar 2024 com a
  // linha de meta de 2026 daria uma leitura errada do passado
  const metas=PORTAL.metas||{};
  let metaAno=0;
  if(cfg.comMeta){
    const alvo = (qual==="vendas" && META_VENDAS_ANO_ANTERIOR) ? (ano-1) : ano;
    metaAno=Number(metas[String(alvo)])||0;
  }
  const metaMes=metaAno?metaAno/12:0;
  /* Média real do ano exibido. No ano corrente conta só os meses FECHADOS
     (mesma regra dos cartões — o mês em curso está pela metade e puxaria a
     linha pra baixo); nos anos já fechados, os 12. */
  const total=vals.reduce((a,b)=>a+(Number(b)||0),0);
  let media;
  if(ano===PORTAL.ano){
    const ch=PORTAL.mesesCheios||0;
    media = ch ? vals.slice(0,ch).reduce((a,b)=>a+(Number(b)||0),0)/ch : 0;
  }else{
    media = total/12;
  }

  const opcoes=anos.map(a=>`<option value="${a}"${a===ano?" selected":""}>${a}</option>`).join("");
  box.innerHTML=
    `<div class="graf-top"><span class="graf-tit">${esc(cfg.titulo)}</span>`+
    `<select onchange="trocarAnoGrafico('${qual}',this.value)" aria-label="Ano do gráfico">${opcoes}</select></div>`+
    graficoSVG(vals,{meta:metaMes,media:media,fmt:cfg.fmt})+
    `<div class="graf-leg">`+
      `<span><span class="bloco-cor" style="background:var(--azul)"></span>${esc(cfg.titulo.split(" por ")[0])}</span>`+
      (metaMes?`<span style="color:var(--verde-esc)"><i></i>Meta mensal: ${dec(metaMes)}</span>`:``)+
      (media?`<span style="color:var(--text3)"><i style="border-top-style:dotted"></i>Média/mês fechado: ${dec(media)}</span>`:``)+
      `<span style="color:var(--text4)">Total em ${ano}: <b>${cfg.fmt(total)}</b></span>`+
    `</div>`;
}

function boot(){
  pintarUsuario(S); renderCards(S);

  // 1) KPIs: pinta NA HORA com a cópia salva e repinta quando o dist/portal.json
  //    chegar. Nada aqui espera o Apps Script — era ele que segurava a tela.
  //    portal.json já vem com os KPIs calculados (mesma fórmula do antigo
  //    portal_() do Code.gs, só que rodada uma vez no build).
  lerEstaticoJa("portal.json","portal", pintarKpis);

  // 2) contagem de atividades: é só um numerinho no botão de Vendas. Vai em
  //    segundo plano; se o Apps Script demorar ou falhar, o resto da tela não
  //    sofre. Só é chamada por quem TEM acesso a VENDAS: para os demais
  //    (ex.: quem só participa das RAS) o backend recusaria com SEM_PERMISSAO
  //    — sem quebrar nada, mas enchendo o log de bloqueio a cada visita e
  //    escondendo uma tentativa real de acesso indevido no meio do ruído.
  if(podeAcessar(S,"VENDAS")){
    ler({action:"atividades"},"atividades").then(pintarAtividades).catch(()=>{});
  }

  // 3) validação da sessão em segundo plano. O redirecionamento do login virou
  //    otimista (entra na hora); quem confere o token de verdade é o Apps
  //    Script — aqui e em toda escrita. Token velho/revogado cai pra fora.
  ler({action:"me"}).then(r=>{ if(r && r.ok===false && r.erro==="NAO_AUTORIZADO") sair(); }).catch(()=>{});
}
function pintarAtividades(r){ const el=document.getElementById("cnt-VENDAS"); if(el&&r&&r.ok)el.textContent=r.total; }

  PORTAL=r;
  const sec = id => document.getElementById(id);

    sec("kpi-vendas").innerHTML=card("Indisponível","—",erroTexto(r.erro));
    ["kpi-obras","kpi-lotes","tri-vendas","tri-obras","tri-lotes"].forEach(id=>sec(id).innerHTML="");
    pintarAtualizado(null, r.offline, r._ts);
    return;
  }
  const vc=r.vendaCasas||{}, ob=r.inicioObras||{}, lt=r.lotes||{};
  const mesNome = r.mesAtualNome || MESES_NOME[(r.mesAtual||1)-1] || "";
  const antNome = r.mesAnteriorNome || "mês anterior";
  const cheios  = r.mesesCheios||0;
  /* Toda média por mês usa só meses FECHADOS. Este rodapé explica o divisor —
     sem ele, quem confere na mão acha que a conta está errada. */
  const notaCheios = cheios ? `${cheios} ${cheios===1?"mês fechado":"meses fechados"} (${mesNome} não entra)`
                            : `nenhum mês fechado em ${r.ano} ainda`;
  const mediaTxt = v => (v==null? "—" : dec(v));

  /* ---------- VENDA DE CASAS ---------- */
  const metaVendas = META_VENDAS_ANO_ANTERIOR ? (vc.metaAnoAnterior||0) : (vc.meta||0);
  const metaVMes = metaVendas?metaVendas/12:0;
  sec("kpi-vendas").innerHTML=
    cardMeta("Casas Vendidas em "+r.ano, num(vc.total), vc.total, metaVendas, null, "hero")+
    cardMes("Vendas em "+mesNome, vc.mesCorrente, vc.mesAnterior, antNome)+
    cardMeta("Média/mês (meses fechados)", mediaTxt(vc.mediaMes), vc.mediaMes, metaVMes, notaCheios)+
    cardMes("VGV em "+mesNome, vc.vgvMes, vc.vgvMesAnterior, antNome, brl)+
    card("VGV no ano", brl(vc.vgv), num(vc.total)+" casas")+
    card("Ticket Médio", brl(vc.ticket), vc.ticketMes?("em "+mesNome+": "+brl(vc.ticketMes)):"média do ano","verde");
  sec("tri-vendas").innerHTML=faixaTrimestral(vc.trimestres, metaVMes, r.ano, "casas vendidas");

  /* ---------- INÍCIO DE OBRAS ---------- */
  const metaOMes=ob.metaMes||0;
  sec("kpi-obras").innerHTML=
    cardMeta("Casas Iniciadas em "+r.ano, dec(ob.iniciadas), ob.iniciadas, ob.meta, null, "hero")+
    cardMes("Iniciadas em "+mesNome, ob.mesCorrente, ob.mesAnterior, antNome, v=>dec(v))+
    cardMeta("Média/mês (meses fechados)", mediaTxt(ob.mediaMes), ob.mediaMes, metaOMes, notaCheios);
  sec("tri-obras").innerHTML=faixaTrimestral(ob.trimestres, metaOMes, r.ano, "casas iniciadas");

  /* ---------- LOTES COMPRADOS (sem meta, confirmado) ---------- */
  sec("kpi-lotes").innerHTML=
    card("Lotes Adquiridos em "+r.ano, num(lt.total),
         "morais: "+num(lt.morais)+" · investidores: "+num(lt.investidores), "hero")+
    cardMes("Lotes em "+mesNome, lt.mesCorrente, lt.mesAnterior, antNome)+
    card("Média/mês (meses fechados)", mediaTxt(lt.mediaMes), notaCheios);
  sec("tri-lotes").innerHTML=faixaTrimestral(lt.trimestres, 0, r.ano, "lotes");

  const nota=sec("nota");
  if(r.offline){ nota.style.display="block"; nota.textContent="Sem internet — últimos dados salvos ("+new Date(r._ts).toLocaleString("pt-BR")+")."; }
  else nota.style.display="none";
  pintarAtualizado(r.updated_at, r.offline, r._ts);

  Object.keys(GRAF).forEach(q=>{ if(GRAF[q].aberto) desenharGrafico(q); });
}
window.aoSincronizar=async()=>{ if(podeAcessar(S,"VENDAS")) pintarAtividades(await ler({action:"atividades"},"atividades")); };
boot();
</script>
