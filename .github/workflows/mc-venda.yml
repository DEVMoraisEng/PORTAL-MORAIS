name: Venda no Mais Controle

# Acionado pelo PORTAL-VENDA (ação mcLancar) com {pageId, aplicar}.
# Gravar no ERP exige as DUAS chaves: aplicar=true no pedido E a variável de
# repositório MC_APLICAR = 1. Sem ela, todo pedido roda como PRÉVIA.
on:
  repository_dispatch:
    types: [mc-venda]
  workflow_dispatch:
    inputs:
      pageId:
        description: "id da página da venda no Notion (32 caracteres)"
        required: true
      aplicar:
        description: "gravar de verdade (só vale com MC_APLICAR=1)"
        type: boolean
        default: false

concurrency:
  group: mc-venda-${{ github.event.client_payload.pageId || inputs.pageId }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lancar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lançar (ou prévia)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MC_ROBO_EMAIL: ${{ secrets.MC_ROBO_EMAIL }}
          MC_ROBO_SENHA: ${{ secrets.MC_ROBO_SENHA }}
          PAGINA: ${{ github.event.client_payload.pageId || inputs.pageId }}
          PEDIU_APLICAR: ${{ github.event.client_payload.aplicar || inputs.aplicar }}
          MC_APLICAR: ${{ vars.MC_APLICAR }}
        run: |
          pip install --quiet requests
          if ! printf '%s' "$PAGINA" | grep -Eq '^[0-9a-fA-F-]{32,36}$'; then
            echo "pageId inválido"; exit 1
          fi
          FLAG=""
          if [ "$PEDIU_APLICAR" = "true" ] && [ "$MC_APLICAR" = "1" ]; then FLAG="--aplicar"; fi
          if [ "$PEDIU_APLICAR" = "true" ] && [ "$MC_APLICAR" != "1" ]; then echo "MC_APLICAR != 1: rodando como PRÉVIA"; FLAG="--bloqueado"; fi
          python -m venda.mc.lancar --page "$PAGINA" $FLAG
