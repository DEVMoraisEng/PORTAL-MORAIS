name: Descobrir medições de contrato no Mais Controle (só leitura)

# 23/10/26: levantamento para o Mapa de Obras mostrar as medições de TODOS os
# contratos em aberto de cada obra (mestre, pintor, eletricista…). Não grava nada
# no Mais Controle e não imprime valores — só caminhos de API e nomes de campos.
# O resultado vai para o ramo "robo-descobertas" (descoberta_medicoes.txt).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robos-mc
  cancel-in-progress: false

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MC_URL: ${{ secrets.MC_URL }}
      MC_USUARIO: ${{ secrets.MC_USUARIO }}
      MC_SENHA: ${{ secrets.MC_SENHA }}
      MC_EMAIL_SENHA_APP: ${{ secrets.MC_EMAIL_SENHA_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Playwright
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium
      - name: Descobrir
        run: |
          SO_CODIGO=1 python -u -m venda.mc.descobrir_medicoes > /tmp/descoberta_medicoes.txt 2>&1 || echo "(código: saiu com erro)" >> /tmp/descoberta_medicoes.txt
          python -u robo_mc_descobrir_medicoes.py >> /tmp/descoberta_medicoes.txt 2>&1 || echo "(saiu com erro)" >> /tmp/descoberta_medicoes.txt
          tail -5 /tmp/descoberta_medicoes.txt
      - name: Guardar o resultado no ramo robo-descobertas
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin robo-descobertas || true
          if git rev-parse --verify origin/robo-descobertas >/dev/null 2>&1; then
            git checkout -B robo-descobertas origin/robo-descobertas
          else
            git checkout --orphan robo-descobertas && git rm -rf -q . || true
          fi
          cp /tmp/descoberta_medicoes.txt descoberta_medicoes.txt
          git add descoberta_medicoes.txt
          git commit -q -m "descoberta medições $(date -u +%FT%TZ)" || true
          git push -q origin robo-descobertas
