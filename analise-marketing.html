<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#295778">
<script>(function(){try{var t=localStorage.getItem("morais_tema");
  if(t!=="claro"&&t!=="escuro") t="claro";
  document.documentElement.dataset.tema=t;}catch(e){}})();</script>
<title>Análise de Marketing · Morais Engenharia</title>
<link rel="icon" href="img/logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#295778;--azul-esc:#1e3f58;--teal:#8FDCD2;--verde:#2a9d5c;--verde-btn:#4cd964;--verde-esc:#1a6b40;
  --bg:#EAF1F3;--bg2:#F5F9FA;--bg3:#dceaef;--border:#b8d0da;--border2:#d0e4ec;
  --text:#1a3347;--text3:#5a8099;--text4:#8aacbb;--sup:#fff;--sombra:rgba(20,40,55,.16);
  --ok:#1a6b40;--ok-bg:#e6f6ec;--at:#8a5a00;--at-bg:#fff4d6;--div:#b3261e;--div-bg:#fdecea;--na:#5a8099;--na-bg:#e4edf1;
  /* séries (paleta validada: dataviz/validate_palette.js — light) */
  --c-cli:#2a78d6;--c-cor:#eb6834;--c-par:#1baf7a;--c-sr:#b9b8b0;--c-sc:#e1e0d9;--c-nc:#f0efec;
  --grade:#e1e0d9;--eixo:#c3c2b7;
}
html[data-tema="escuro"]{
  color-scheme:dark;
  --azul:#2f6e93;--azul-esc:#122430;--teal:#79c8bf;--verde:#2f9e63;--verde-btn:#3cbf5d;--verde-esc:#17603a;
  --bg:#0e1920;--bg2:#15222c;--bg3:#1a2c38;--border:#2d4757;--border2:#243a4a;
  --text:#e7eff5;--text3:#9db4c4;--text4:#7794a6;--sup:#15222c;--sombra:rgba(0,0,0,.45);
  --ok:#6fd49b;--ok-bg:#143325;--at:#f0c264;--at-bg:#3a2e12;--div:#f08a7e;--div-bg:#3b1c19;--na:#9db4c4;--na-bg:#1f3340;
  --c-cli:#3987e5;--c-cor:#d95926;--c-par:#199e70;--c-sr:#6b6a65;--c-sc:#45443f;--c-nc:#2c2c2a;
  --grade:#2c2c2a;--eixo:#383835;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;min-height:100vh}
.cond{font-family:'Barlow Condensed',Inter,sans-serif}
header{background:linear-gradient(120deg,var(--azul-esc),var(--azul))}
header::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--verde-btn),var(--teal))}
.hbar{display:flex;align-items:center;gap:13px;padding:10px 16px;flex-wrap:wrap}
.logo{background:#fff;border-radius:9px;padding:4px 9px;display:inline-flex}.logo img{height:32px;display:block}
.htitle{font-family:'Barlow Condensed';font-weight:800;font-size:22px;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.hsub{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;margin-top:2px}
.hspace{flex:1}
.hbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.22)}
main{max-width:1480px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:16px}
main>*{min-width:0}
.hide{display:none!important}
.painel{background:var(--sup);border:1px solid var(--border2);border-radius:12px;padding:16px 18px;min-width:0}
.tit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg3);border-left:4px solid var(--verde);border-radius:8px;padding:8px 13px;margin-bottom:12px}
.tit .cond{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--azul-esc)}
html[data-tema="escuro"] .tit .cond{color:var(--text)}
.tit em{font-style:normal;margin-left:auto;font-size:12px;color:var(--text3)}
.dica{font-size:12.5px;color:var(--text3);margin:0}
.btn{font:inherit;font-weight:700;font-size:13.5px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);color:var(--text);padding:0 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--azul)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.pri:hover{background:var(--verde-esc)}
.btn.conf{background:var(--at-bg);border-color:var(--at);color:var(--at)}
.btn.zap{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.peq{font-size:12.5px;padding:0 11px}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.carregando{padding:40px 10px;text-align:center;color:var(--text3)}
.aviso{border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600}
.aviso.erro{background:var(--div-bg);color:var(--div)}
.aviso.at{background:var(--at-bg);color:var(--at)}

/* abas */
.abas{display:flex;gap:4px;border-bottom:2px solid var(--border2);flex-wrap:wrap}
.aba{font:inherit;font-weight:700;font-size:14px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--text3);padding:0 16px;min-height:44px;cursor:pointer}
.aba[aria-selected="true"]{color:var(--text);border-bottom-color:var(--verde)}
.abas.grandes .aba{font-family:'Barlow Condensed';font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.chipb{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:99px;padding:0 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipb[aria-pressed="true"]{border-color:var(--verde);background:var(--ok-bg);color:var(--ok)}
.chipb small{font-weight:600;color:var(--text3)}
/* 25/11: sub-abas (dentro de Campanhas) com cara diferente das abas principais */
.subabas{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:6px;margin:12px 0}
.subabas .rot{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);padding:0 8px 0 6px}
.subaba{font:inherit;font-size:13.5px;font-weight:700;border:1px solid transparent;background:transparent;color:var(--text3);border-radius:9px;padding:0 14px;min-height:44px;cursor:pointer}
.subaba:hover{color:var(--text);background:var(--sup)}
.subaba[aria-selected="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.subaba.dec{color:var(--verde)}
.subaba.dec[aria-selected="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.abas.grandes{border-bottom-width:3px}
.abas.grandes .aba[aria-selected="true"]{border-bottom-width:4px}
/* 25/11: linhas do Hudson */
:root{--hud:#6b3fd1;--hud-bg:#f1ebff}
html[data-tema="escuro"]{--hud:#b79cff;--hud-bg:#2a2140}
tr.hud td{background:var(--hud-bg)}
tr.hud td:first-child{box-shadow:inset 4px 0 0 var(--hud)}
.hudtag{display:inline-block;background:var(--hud);color:#fff;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800;letter-spacing:.4px}
html[data-tema="escuro"] .hudtag{color:#1a1030}
.st.hud{background:var(--hud-bg);color:var(--hud);border:1px solid var(--hud)}
.planilhas{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.planilhas .rot{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text3)}
.sug{font-size:11px;color:var(--text3);display:block;margin-top:2px}
/* 25/11: card do anúncio */
.lnk{font:inherit;font-weight:700;color:var(--azul);background:none;border:0;padding:6px 4px;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:center}
html[data-tema="escuro"] .lnk{color:var(--teal)}
.modal-fundo{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:var(--sup);border:1px solid var(--border2);border-radius:14px;box-shadow:0 18px 50px var(--sombra);width:min(960px,100%);max-width:100%;padding:16px 18px;min-width:0}
.modal-cab{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
@media(max-width:600px){.modal{padding:13px 12px}.modal-fundo{padding:10px 8px}}
/* 25/11: decisões */
.vered{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.v-esc{background:var(--ok-bg);color:var(--ok)}.v-man{background:var(--na-bg);color:var(--na)}.v-rev{background:var(--at-bg);color:var(--at)}
.v-pau{background:var(--div-bg);color:var(--div)}.v-poc{background:transparent;color:var(--text3);border:1px dashed var(--border)}
.tag-cor{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--c-cor)}
.funil{display:flex;flex-direction:column;gap:8px}
.funil .f{display:grid;grid-template-columns:200px 1fr 200px;gap:10px;align-items:center;font-size:13px}
.funil .f>span:last-child{white-space:nowrap}
.funil .bar{height:22px;background:var(--bg3);border-radius:6px;overflow:hidden}
.funil .bar i{display:block;height:100%;background:var(--c-cli);border-radius:6px 4px 4px 6px}
.funil .f b{font-family:'Barlow Condensed';font-size:20px}
.funil .fg{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding-bottom:3px;border-bottom:1px solid var(--border2);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.funil .fg:first-child{margin-top:0}
.semclass{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--text2);background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--text3);border-radius:8px;padding:9px 12px}
.semclass ul{margin:4px 0;padding-left:18px}
.funil .fg small{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
@media(max-width:600px){.funil .f{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.funil .bar{grid-column:1/-1;grid-row:2}.funil .f>span:last-child .muted{font-size:12px}}
.destaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dest{background:var(--bg2);border:1px solid var(--border2);border-radius:11px;padding:12px 14px;min-width:0}
.dest .r{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text3)}
.dest .n{font-family:'Barlow Condensed';font-weight:800;font-size:22px;line-height:1.15;margin:3px 0;overflow-wrap:anywhere}
.dest .p{font-size:12.5px;color:var(--text3)}
.dest.bom{border-left:4px solid var(--verde)}.dest.ruim{border-left:4px solid var(--div)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros .hspace{flex:1}
input[type=search],select{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:0 10px;min-height:44px;max-width:100%}
input[type=search]{min-width:0;width:240px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg2);border:1px solid var(--border2);border-radius:11px;padding:11px 13px;min-width:0;position:relative}
.kpi .n{font-family:'Barlow Condensed';font-weight:800;font-size:32px;line-height:1}
.kpi .r{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-top:4px}
.kpi .p{font-size:12px;color:var(--text3)}
.kpi i.sw{position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:4px}
.dois{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:900px){.dois{grid-template-columns:1fr}}

/* legenda + barras empilhadas */
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text3);margin:4px 0 10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.pilha{display:flex;height:16px;gap:2px;border-radius:4px;overflow:hidden;min-width:60px}
.pilha i{display:block;height:100%}
.pilha.alta{height:26px}
.sw-cli{background:var(--c-cli)}.sw-cor{background:var(--c-cor)}.sw-par{background:var(--c-par)}.sw-sr{background:var(--c-sr)}.sw-sc{background:var(--c-sc)}.sw-nc{background:var(--c-nc);box-shadow:inset 0 0 0 1px var(--eixo)}

/* tabelas */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border2);border-radius:10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--border2);border-right:1px solid var(--border2);vertical-align:middle}
th:last-child,td:last-child{border-right:0}
th{background:var(--bg3);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--text3);white-space:nowrap;position:sticky;top:0}
th.num,td.num{text-align:center;font-variant-numeric:tabular-nums}
th.ord{cursor:pointer}
th.ord:hover{color:var(--text)}
tr:last-child td{border-bottom:0}
td .muted{color:var(--text3);font-size:12px}
td.nome{font-weight:600;min-width:150px}
.tbl-wrap.alta{max-height:560px;overflow:auto}

/* gráfico por dia */
.dias-wrap{display:flex;gap:6px;align-items:stretch}
.dias-eixo{position:relative;width:28px;flex:0 0 28px;height:170px;margin-bottom:20px}
.dias-eixo span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--text3)}
.dias-rol{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dias{display:flex;gap:2px;height:190px;align-items:stretch;background:linear-gradient(to top,var(--eixo) 1px,transparent 1px) bottom 20px left/100% calc(100% - 20px) no-repeat,repeating-linear-gradient(to top,var(--grade) 0 1px,transparent 1px calc(170px / var(--linhas))) bottom 20px left/100% 170px no-repeat}
.dia{flex:1 1 0;min-width:8px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:default}
.dia .col{display:flex;flex-direction:column-reverse;gap:1px;border-radius:4px 4px 0 0;overflow:hidden;margin-bottom:20px;max-height:170px}
.dia .col i{display:block;min-height:1px}
.dia .rot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text3);white-space:nowrap}
.dia:hover .col{filter:brightness(1.08)}
.tip{position:fixed;z-index:70;background:var(--azul-esc);color:#fff;border-radius:9px;padding:8px 11px;font-size:12.5px;pointer-events:none;box-shadow:0 6px 20px var(--sombra);max-width:260px}
.tip b{display:block;margin-bottom:3px}
.tip .l{display:flex;align-items:center;gap:6px}
.tip .l i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* redirecionamento */
.st{display:inline-flex;flex-direction:column;gap:2px;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;min-width:150px;line-height:1.25}
.st small{font-weight:500;font-size:11.5px}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.at{background:var(--at-bg);color:var(--at)}
.st.div{background:var(--div-bg);color:var(--div)}
.st.na{background:var(--na-bg);color:var(--na)}
.envio{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:nowrap}
.envio select{min-width:150px}
.ret{max-width:280px;margin:0 auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;text-align:left}
.origem{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--bg3);color:var(--text3);white-space:nowrap}
.origem.site{background:var(--at-bg);color:var(--at)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--azul-esc);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 6px 20px var(--sombra)}
.toast.erro{background:var(--div)}
.cls-sel{font-size:16px;min-height:44px}
details.lista>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700}
details.lista>summary::-webkit-details-marker{display:none}
footer{max-width:1480px;margin:0 auto;padding:0 16px 24px;color:var(--text4);font-size:11.5px}
@media(max-width:600px){
  .hbar{padding:8px 12px}.htitle{font-size:19px}
  main{padding:14px 10px 48px}
  .painel{padding:13px 12px}
  input[type=search]{width:100%}
  .filtros>*{flex:1 1 auto}
  .kpi .n{font-size:28px}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <span class="logo"><img src="img/logo.png" alt="Morais" onerror="this.parentNode.style.display='none'"></span>
    <div style="min-width:0">
      <div class="htitle">Análise de Marketing</div>
      <div class="hsub">Campanhas da Meta · redirecionamento de leads</div>
    </div>
    <div class="hspace"></div>
    <a class="hbtn" href="index.html" title="Voltar para o portal">← Portal</a>
    <button class="hbtn" onclick="(function(){var e=document.documentElement,t=e.dataset.tema==='escuro'?'claro':'escuro';e.dataset.tema=t;try{localStorage.setItem('morais_tema',t)}catch(x){}})()" title="Alternar claro/escuro" aria-label="Alternar claro/escuro">◐</button>
  </div>
</header>

<main id="app">
  <div class="abas grandes" role="tablist">
    <button class="aba" role="tab" id="aba-camp" aria-selected="true" onclick="irPara('camp')">Campanhas</button>
    <button class="aba" role="tab" id="aba-red" aria-selected="false" onclick="irPara('red')">Redirecionamento de leads</button>
  </div>
  <section id="sec-camp"><div class="carregando">Lendo as planilhas de campanha…</div></section>
  <section id="sec-red" class="hide"><div class="carregando">Lendo os leads…</div></section>
</main>
<footer id="rodape"></footer>
<div class="tip hide" id="tip" role="tooltip"></div>

<script src="app.js?v=47"></script>
<script>
"use strict";
/* ===== ANÁLISE DE MARKETING (24/11/26) =======================================
 * Grupo ANÁLISES do portal. Duas abas:
 *  - CAMPANHAS: cada aba de campanha da planilha "LEADS RESERVA DOS IPES -
 *    CANEDO" (da 3ª em diante, com ad_name/adset_name) vira uma aba aqui, mais
 *    o Comparativo. Captação por anúncio (ad_name) e por conjunto (adset_name),
 *    qualificado × desqualificado (lead_status da Meta) e cliente × corretor ×
 *    respondeu e parou × sem resposta (conversas/Oportunidades da HyperFlow).
 *  - REDIRECIONAMENTO: leads clientes que a HyperFlow grava na planilha
 *    ATENDIMENTOS → botão de envio para a planilha da imobiliária, com alerta
 *    de quanto tempo está sem retorno; leads novos do site → só Hudson.
 * Servidor: apps-script/MarketingLeads.gs (PORTAL-LEITURA). Acesso:
 * "ANÁLISE DE MARKETING" na coluna ACESSOS do LOGINS (ADM/MASTER sempre).
 * ============================================================================ */
const PAGINA_VERSAO = "v5";
const SESS = exigirSessao();
const $ = s => document.querySelector(s);
const escA = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ERROS = {
  NAO_AUTORIZADO:"Sessão vencida — entre de novo no portal.",
  SEM_PERMISSAO:"Seu login não tem o acesso ANÁLISE DE MARKETING (peça ao ADM).",
  MODO_TESTE:"Login de TESTES não grava nada.",
  APENAS_ADM:"Só ADM/MASTER pode fazer isso.",
  ACAO_DESCONHECIDA:"O servidor ainda não tem a Análise de Marketing (Apps Script sem o MarketingLeads.gs ou sem publicar nova versão).",
  JA_ENVIADO:"Esse lead já foi enviado",
  JA_ESTA_NA_PLANILHA:"Esse telefone já está na planilha",
  LEAD_NAO_ENCONTRADO:"Lead não encontrado na planilha de atendimentos (a planilha mudou?) — atualize a tela.",
  DESTINO_INVALIDO:"Escolha a imobiliária."
};
function msgErro(c){ const s=String(c||""); const b=s.split(":")[0].trim(); const resto=s.slice(b.length+1).trim(); return (ERROS[b]? ERROS[b]+(resto?" ("+resto+")":"") : (typeof erroTexto==="function"?erroTexto(s):s)) || "erro desconhecido"; }

async function api(payload){

  if(!r) return { ok:false, erro:"resposta vazia do servidor" };
  if(r.ok===false && /ACAO_DESCONHECIDA|nao encontrada|não encontrada/i.test(String(r.erro||""))) r.erro="ACAO_DESCONHECIDA";
  return r;
}

  const ult=a=>a.leads.reduce((m,l)=>(l.t||"")>m?(l.t||""):m,"");
  r.abas.sort((a,b)=>ult(b).localeCompare(ult(a)));
  const ant=r.abas.length-1;
  r.abas.forEach((a,i)=>{ a.rot = i===0 ? "CAMPANHA ATUAL" : "CAMPANHA ANTIGA"+(ant>1? " "+i : ""); });

function fmtDH(iso){ if(!iso) return "—"; const m=String(iso).match(/(\d{4})-(\d\d)-(\d\d)T?(\d\d)?:?(\d\d)?/); if(!m) return iso; return m[3]+"/"+m[2]+(m[4]?" "+m[4]+":"+m[5]:""); }
function fmtD(iso){ const m=String(iso||"").match(/(\d{4})-(\d\d)-(\d\d)/); return m? m[3]+"/"+m[2]+"/"+m[1] : "—"; }

function contar(leads){

function graficoDias(leads){
  const por={}; leads.forEach(l=>{ const d=(l.t||"").slice(0,10); if(!d) return; (por[d]=por[d]||[]).push(l); });
  const dias=Object.keys(por).sort(); if(!dias.length) return '<p class="dica">Sem datas.</p>';
  /* preenche os dias sem lead */
  const todos=[]; let d=new Date(dias[0]+"T12:00:00"); const fim=new Date(dias[dias.length-1]+"T12:00:00");
  while(d<=fim && todos.length<400){ todos.push(d.toISOString().slice(0,10)); d=new Date(d.getTime()+86400000); }
  const max=Math.max(...todos.map(x=>(por[x]||[]).length),1);
  const passo = max<=5?1: max<=10?2: max<=25?5: max<=60?10: 25;
  const topo = Math.ceil(max/passo)*passo;
  const marca = (i,dia)=> i===0 || i===todos.length-1 || (todos.length>24 ? /-(01|08|15|22)$/.test(dia) : todos.length>10 ? i%2===0 : true);
  let h='<div class="dias-wrap"><div class="dias-eixo">'+Array.from({length:topo/passo+1},(_,k)=>'<span style="bottom:'+(k*passo*100/topo)+'%">'+(k*passo)+'</span>').join("")+'</div>'+
    '<div class="dias-rol"><div class="dias" style="min-width:'+(todos.length*12)+'px;--linhas:'+(topo/passo)+'">';
  todos.forEach((dia,i)=>{
    const c=contar(por[dia]||[]);
    h+='<div class="dia" data-tip="'+escA(JSON.stringify(Object.assign({dia},c)))+'"><div class="col" style="height:'+(c.n*100/topo)+'%">'+
      CLS.filter(x=>c[x.id]).map(x=>'<i class="'+x.sw+'" style="flex:'+c[x.id]+'"></i>').join("")+'</div>'+
      '<span class="rot">'+(marca(i,dia)? dia.slice(8,10)+'/'+dia.slice(5,7) : '')+'</span></div>';
  });
  return h+'</div></div></div><p class="dica">Pico: '+max+' leads/dia · passe o mouse (ou toque) na barra para ver o dia.</p>';
}

/* 25/11: por que o lead está "sem classificação" — sem telefone válido × telefone que a leitura da HyperFlow ainda não pegou */

/* ===================== DECISÕES (25/11) =====================
   Só a campanha atual. Taxas sobre o TOTAL de leads (pedido do Morais em 25/11). */
const DEC = { min:10, escalar:1.3, rever:0.7, pausar:15 };
function metricas(ls){
  const c=contar(ls); const base=c.n-c["SEM CONVERSA"]-c[""];
  const resp=c.CLIENTE+c.CORRETOR+c["RESPONDEU E PAROU"];
  const comp=ls.filter(l=>clsDe(l)==="CLIENTE"&&l.completo).length;
  const env=ls.filter(l=>l.env).length, ret=ls.filter(l=>l.env&&l.ret).length, atend=ls.filter(l=>l.atend).length;
  const n=c.n;
  return Object.assign(c,{ base, resp, comp, env, ret, atend, tCli: n? c.CLIENTE/n : 0, tResp: n? resp/n : 0, tCor: n? c.CORRETOR/n : 0 });
}
function veredito(m, media){
  if(m.n < DEC.min) return {id:"poc", rot:"Pouca amostra", ord:4, por:"menos de "+DEC.min+" leads"};
  if(m.CLIENTE===0 && m.n>=DEC.pausar) return {id:"pau", rot:"Pausar", ord:3, por:"nenhum cliente em "+m.n+" leads"};
  if(media>0 && m.tCli>=media*DEC.escalar && m.CLIENTE>=2) return {id:"esc", rot:"Escalar", ord:0, por:"taxa de cliente "+pctT(m.tCli)+" (média "+pctT(media)+")"};
  if(media>0 && m.tCli<media*DEC.rever) return {id:"rev", rot:"Rever", ord:2, por:"taxa de cliente "+pctT(m.tCli)+" abaixo da média "+pctT(media)};
  return {id:"man", rot:"Manter", ord:1, por:"taxa de cliente perto da média ("+pctT(media)+")"};
}
function pctT(x){ return (Math.round(x*1000)/10).toLocaleString("pt-BR")+"%"; }
function tabelaDecisao(grupos, media, titulo, anuncio){

function decisoes(){
  const C=ST.C; const atual=C.abas[0]; const todos=[]; (atual? [atual]:[]).forEach(a=>a.leads.filter(noPeriodo).forEach(l=>todos.push(Object.assign({aba:a.nome},l))));
  const M=metricas(todos), media=M.tCli;
  const porAd=Object.entries(todos.reduce((g,l)=>{(g[l.ad]=g[l.ad]||[]).push(l);return g},{})).map(([k,ls])=>Object.assign({nome:k},metricas(ls)));
  const porSet=Object.entries(todos.reduce((g,l)=>{(g[l.adset]=g[l.adset]||[]).push(l);return g},{})).map(([k,ls])=>Object.assign({nome:k},metricas(ls)));
  const comAmostra=porAd.filter(g=>g.n>=DEC.min);
  const melhor=comAmostra.slice().sort((a,b)=>b.tCli-a.tCli||b.CLIENTE-a.CLIENTE)[0];
  const pior=comAmostra.slice().sort((a,b)=>a.tCli-b.tCli||b.n-a.n)[0];
  const ultSem=semanas(todos);
  const dest=(cls,r,n,p)=>'<div class="dest '+cls+'"><div class="r">'+r+'</div><div class="n">'+n+'</div><div class="p">'+p+'</div></div>';
  let h='<div class="painel"><div class="tit"><span class="cond">O que está dando retorno</span><em>só a campanha atual'+(atual?' (aba '+escA(atual.nome)+')':'')+' · '+(ST.periodo==="tudo"?"todo o período":"últimos "+ST.periodo+" dias")+'</em></div><div class="destaques">'+
    dest("", "Taxa de cliente", pctT(M.tCli), M.CLIENTE+" clientes em "+M.n+" leads")+
    dest("", "Taxa de resposta", pctT(M.tResp), M.resp+" responderam a HyperFlow")+
    (melhor? dest("bom","Melhor anúncio",escA(melhor.nome),pctT(melhor.tCli)+" viram cliente ("+melhor.CLIENTE+" de "+melhor.n+")") : dest("","Melhor anúncio","—","nenhum anúncio com "+DEC.min+"+ leads"))+
    (pior&&pior!==melhor? dest("ruim","Pior anúncio",escA(pior.nome),pctT(pior.tCli)+" viram cliente ("+pior.CLIENTE+" de "+pior.n+")") : "")+
    dest("", "Enviados às imobiliárias", M.env, M.ret+" com retorno da imobiliária ("+pctT(M.env? M.ret/M.env : 0)+" dos enviados)")+
  '</div></div>';
  h+='<div class="painel"><div class="tit"><span class="cond">Funil — do anúncio à imobiliária</span></div>'+funil(M)+semClassInfo(todos)+'</div>';
  h+='<div class="painel"><div class="tit"><span class="cond">Decisão por anúncio</span><em>média de cliente: '+pctT(media)+'</em></div>'+tabelaDecisao(porAd,media,"Anúncio",true)+'</div>';
  h+='<div class="painel"><div class="tit"><span class="cond">Decisão por conjunto (público)</span></div>'+tabelaDecisao(porSet,media,"Conjunto")+'</div>';
  h+='<div class="painel"><div class="tit"><span class="cond">Semana a semana</span><em>a campanha está melhorando ou piorando?</em></div>'+ultSem+'</div>';
  h+='<div class="painel"><div class="tit"><span class="cond">Como a decisão é calculada</span></div><ul class="dica" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">'+
    '<li>As decisões olham só a <b>campanha atual</b> (a aba da planilha com o lead mais novo). A campanha antiga fica na sub-aba dela e no Comparativo.</li>'+
    '<li><b>Taxa de cliente</b> = clientes ÷ total de leads da campanha. A média é a da campanha atual no período escolhido.</li>'+
    '<li><span class="vered v-esc">Escalar</span> taxa de cliente ≥ '+Math.round(DEC.escalar*100)+'% da média e pelo menos 2 clientes · <span class="vered v-man">Manter</span> perto da média · <span class="vered v-rev">Rever</span> abaixo de '+Math.round(DEC.rever*100)+'% da média · <span class="vered v-pau">Pausar</span> nenhum cliente em '+DEC.pausar+'+ leads · <span class="vered v-poc">Pouca amostra</span> menos de '+DEC.min+' leads.</li>'+
    '<li><b>Atrai mais corretor</b>: o anúncio trouxe mais corretores que clientes (3 ou mais).</li>'+
    '<li><b>Enviados à imobiliária / com retorno</b>: o telefone do lead está na planilha de uma das imobiliárias / com retorno de verdade na coluna RETORNO ou ATUALIZAÇÃO ("sem retorno" e "aguardando retorno" não contam). Responderam, clientes e qualificação completa são sobre o total de leads; com retorno é sobre os enviados.</li>'+
    '<li>Sem o valor investido por anúncio não dá para calcular custo por cliente. Se a planilha da Meta ganhar a coluna de gasto, entra aqui.</li></ul></div>';
  return h;
}

function funil(M){
  const grupos=[
    ["Captação",null,[["Leads captados",M.n,M.n,""]],true],
    ["Na HyperFlow","sobre os "+M.n+" leads",[["Responderam",M.resp,M.n,"dos leads"],["Clientes",M.CLIENTE,M.n,"dos leads"],["Qualificação completa",M.comp,M.n,"dos leads"]]],

  ];
  return '<div class="funil">'+grupos.map(([g,sub,et,cinza])=>'<div class="fg"><span>'+g+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</div>'+

}
/* quantos clientes estão nas planilhas das imobiliárias × quantos vieram destes anúncios (todo o período) */
function notaEnvio(){

    (e.semTelefone? ', e '+e.semTelefone+' '+(e.semTelefone===1?'linha está':'linhas estão')+' sem telefone na planilha da imobiliária (não dá para ligar ao anúncio)':'')+'. Todo o período.</p>';

function semanas(ls){
  const sem=d=>{ const x=new Date(d.slice(0,10)+"T12:00:00"); const dia=(x.getDay()+6)%7; x.setDate(x.getDate()-dia); return x.toISOString().slice(0,10); };
  const g={}; ls.forEach(l=>{ if(!l.t) return; const k=sem(l.t); (g[k]=g[k]||[]).push(l); });
  const ks=Object.keys(g).sort(); if(!ks.length) return '<p class="dica">Sem datas.</p>';
  let ant=null;
  return '<div class="tbl-wrap"><table><thead><tr><th>Semana (seg)</th><th>Leads</th><th>Clientes</th><th>Taxa de cliente</th><th>Corretores</th><th>Taxa de resposta</th><th>vs. semana anterior</th></tr></thead><tbody>'+
    ks.map(k=>{ const m=metricas(g[k]); let vs='<span class="muted">—</span>';
      if(ant && ant.n>=5 && m.n>=5){ const d=(m.tCli-ant.tCli)*100; vs=Math.abs(d)<1?'<span class="muted">igual</span>':(d>0?'<span style="color:var(--ok);font-weight:700">▲ '+d.toFixed(1).replace(".",",")+' p.p.</span>':'<span style="color:var(--div);font-weight:700">▼ '+(-d).toFixed(1).replace(".",",")+' p.p.</span>'); }
      ant=m; return '<tr><td>'+fmtD(k)+'</td><td class="num">'+m.n+'</td><td class="num"><b>'+m.CLIENTE+'</b></td><td class="num"><b>'+pctT(m.tCli)+'</b></td><td class="num">'+m.CORRETOR+'</td><td class="num">'+pctT(m.tResp)+'</td><td>'+vs+'</td></tr>'; }).join("")+'</tbody></table></div>';
}

function comparativo(){
  const C=ST.C;
  const porAba=C.abas.map(a=>Object.assign({nome:rotCamp(a.nome)}, metricas(a.leads.filter(noPeriodo))));
  const todos=[]; C.abas.forEach(a=>a.leads.filter(noPeriodo).forEach(l=>todos.push(Object.assign({aba:a.nome},l))));
  const tot=contar(todos);
  const rank=(cls)=>{
    const g=agrupar(todos,"ad").filter(x=>x[cls]).sort((a,b)=>b[cls]-a[cls]||pct(b[cls],b.n)-pct(a[cls],a.n)).slice(0,8);

      g.map(x=>'<tr><td class="nome">'+escA(x.nome)+'</td><td class="num"><b>'+x[cls]+'</b></td><td><div class="pilha"><i class="'+(cls==="CLIENTE"?"sw-cli":"sw-cor")+'" style="flex:'+x[cls]+'"></i><i style="flex:'+(max-x[cls])+';background:transparent"></i></div></td><td class="num">'+pct(x[cls],x.n)+'% <span class="muted">de '+x.n+'</span></td></tr>').join("")+'</tbody></table></div>';
  };
  return '<div class="painel"><div class="tit"><span class="cond">Todas as campanhas</span><em>'+C.abas.length+' abas de campanha</em></div>'+kpis(tot)+'</div>'+
    '<div class="painel"><div class="tit"><span class="cond">Campanha × resultado</span></div>'+legenda()+tabelaGrupo("aba",porAba,"Campanha")+
      '<p class="dica" style="margin-top:8px">Cada aba da planilha de marketing com ad_name e adset_name é uma campanha: '+C.abas.map(a=>'<b>'+escA(rotCamp(a.nome))+'</b> = aba '+escA(a.nome)).join(" · ")+'. A aba com o lead mais novo é a campanha atual; aba nova aparece aqui sozinha.</p></div>'+
    '<div class="dois"><div class="painel"><div class="tit"><span class="cond">Anúncios que mais geram clientes</span></div>'+rank("CLIENTE")+'</div>'+
    '<div class="painel"><div class="tit"><span class="cond">Anúncios que mais geram corretores</span></div>'+rank("CORRETOR")+'</div></div>'+
    '<div class="painel"><div class="tit"><span class="cond">Anúncio × resultado (todas as campanhas)</span></div>'+tabelaGrupo("adall",agrupar(todos,"ad"),"Anúncio")+'</div>'+

      '<li><b>Qualificado / desqualificado</b>: coluna lead_status da Meta (QualifiedLead / DisqualifiedLead; CREATED = sem status).</li>'+
      '<li><b>Cliente / corretor / respondeu e parou / sem resposta</b>: leitura das conversas da HyperFlow (campanha do lançamento) e da tela Oportunidades (Prospecção = sem resposta; Ativo/Pendente cliente = cliente; Ativo/Pendente corretor = corretor). Lead que a HyperFlow gravou na planilha de atendimentos conta como cliente.</li>'+
      '<li><b>Sem conversa na HyperFlow</b>: o telefone não tem conversa na HyperFlow (atendido antes, por outro canal).</li>'+

async function carregarLeads(forcar){
  if(!ST.L) $("#sec-red").innerHTML='<div class="carregando">Lendo os leads e as planilhas das imobiliárias…</div>';
  const r = await api({ action:"mkLeads", forcar: !!forcar });

function horas(iso){ if(!iso) return null; const d=new Date(String(iso).replace(" ","T")); return isNaN(d)? null : Math.max(0,(Date.now()-d.getTime())/3600000); }
function tempo(h){ if(h==null) return ""; if(h<1) return "menos de 1 h"; if(h<24) return Math.round(h)+" h"; const d=Math.floor(h/24); return d+(d===1?" dia":" dias"); }
function statusLead(l){
  if(l.tipo==="hudson"){
    if(l.enviado) return '<span class="st hud">Enviado ao <b>HUDSON</b><small>'+fmtDH(l.enviadoEm)+(l.enviadoPor?' · '+escA(l.enviadoPor):'')+'</small></span>';
    const h=horas(l.t); return '<span class="st hud">'+(h>24?'⚠ ':'')+'Falta enviar ao <b>HUDSON</b><small>chegou há '+tempo(h)+'</small></span>';
  }

  if(temRet(l)) return '<span class="st ok">Com retorno da imobiliária<small>'+escA(l.destino||"")+(l.atualizacao?' · '+escA(l.atualizacao):'')+'</small></span>';
  const h = l.semRetornoHoras!=null ? l.semRetornoHoras : horas(l.enviadoEm||l.t);
  const cls = h==null? 'na' : h>=72? 'div' : h>=24? 'at' : 'na';
  return '<span class="st '+cls+'">⚠ Sem retorno há '+(h==null?'?':tempo(h))+'<small>'+escA(l.destino||"destino não identificado")+(l.foraDoPortal?' · enviado fora do portal':'')+'</small></span>';
}
function temRet(l){ return l.temRetorno!=null ? !!l.temRetorno : !!l.retorno; }
function textoLead(l){
  const linhas=[ "*"+(l.nome||"Lead")+"*", "📞 "+(l.tel||""), l.email?"✉ "+l.email:"", "🗓 "+fmtDH(l.t), "Origem: "+l.origem ];

function celulaEnvio(l, i){

    (conf? '<button class="btn conf peq" onclick="enviar('+i+')"'+(ST.enviando?' disabled':'')+'>Confirmar → '+escA(ST.conf.destino)+'</button>' : '<button class="btn pri peq" onclick="preEnviar('+i+')">Enviar</button>')+'</div>';

function ehAdmTela(){ const t=String(SESS&&SESS.tipo||SESS&&SESS.t||"").toUpperCase(); return t==="ADM"||t==="MASTER"; }
function filtrados(){
  const b=ST.busca.trim().toLowerCase(), bd=b.replace(/\D/g,"");
  return ST.L.itens.map((l,i)=>Object.assign({i},l)).filter(l=>{
    if(ST.fEnv==="nao" && l.enviado) return false;
    if(ST.fEnv==="sim" && !l.enviado) return false;
    if(ST.fOri==="atend" && l.tipo!=="corretor") return false;
    if(ST.fOri==="hudson" && l.tipo!=="hudson") return false;
    if(b && !((l.nome||"").toLowerCase().includes(b) || (bd.length>=4 && String(l.telCru||"").includes(bd)) || (l.destino||"").toLowerCase().includes(b))) return false;
    return true;
  });
}
function desenharLeads(){
  const L=ST.L; if(!L) return;
  const it=L.itens;
  const n=(f)=>it.filter(f).length;
  const semRet=n(l=>l.tipo==="corretor"&&l.enviado&&!temRet(l));
  const hudsonPend=it.filter(l=>l.tipo==="hudson"&&!l.enviado);
  const chip=(grp,v,r,c)=>'<button class="chipb" aria-pressed="'+(ST[grp]===v)+'" onclick="ST.'+grp+'=\''+v+'\';desenharLeads()">'+r+' <small>'+c+'</small></button>';
  const lista=filtrados();
  let h='<div class="painel"><div class="kpis">'+
    '<div class="kpi"><div class="n">'+n(l=>!l.enviado&&l.tipo==="corretor")+'</div><div class="r">Clientes aguardando envio</div></div>'+
    '<div class="kpi"><div class="n">'+semRet+'</div><div class="r">Enviados sem retorno da imobiliária</div></div>'+
    '<div class="kpi"><div class="n">'+hudsonPend.length+'</div><div class="r">Site · falta enviar ao Hudson</div></div>'+
    '<div class="kpi"><div class="n">'+n(l=>l.enviado)+'</div><div class="r">Enviados</div></div></div></div>';
  h+='<div class="painel"><div class="filtros" style="margin-bottom:10px">'+
      '<div class="sub" role="group" aria-label="Envio">'+chip("fEnv","nao","Não enviados",n(l=>!l.enviado))+chip("fEnv","sim","Enviados",n(l=>l.enviado))+chip("fEnv","geral","Geral",it.length)+'</div>'+
      '<div class="sub" role="group" aria-label="Origem">'+chip("fOri","todos","Todas as origens",it.length)+chip("fOri","atend","Atendimento (corretores)",n(l=>l.tipo==="corretor"))+chip("fOri","hudson","Site → Hudson",n(l=>l.tipo==="hudson"))+'</div></div>'+
    '<div class="filtros" style="margin-bottom:12px"><input type="search" placeholder="Buscar nome, telefone ou imobiliária" value="'+escA(ST.busca)+'" oninput="ST.busca=this.value;desenharTabela()" aria-label="Buscar">'+
      '<span class="hspace"></span>'+
      '<button class="btn peq" onclick="copiarHudson()"'+(hudsonPend.length?'':' disabled')+'>Copiar todos do Hudson não enviados ('+hudsonPend.length+')</button>'+
      (ST.copiouHudson&&hudsonPend.length?'<button class="btn pri peq" onclick="confirmarHudson(ST.L.itens.map((l,i)=>i).filter(i=>ST.L.itens[i].tipo===\'hudson\'&&!ST.L.itens[i].enviado))">Marcar os '+hudsonPend.length+' como enviados ao Hudson</button>':'')+
      '<a class="btn peq" href="'+escA(L.planilhaAtendimentos)+'" target="_blank" rel="noopener">Planilha de atendimentos ↗</a>'+
      '<button class="btn peq" onclick="carregarLeads(true)">↻ Atualizar</button></div>'+
    (L.erros&&L.erros.length?'<div class="aviso at" style="margin-bottom:10px">Não consegui ler: '+escA(L.erros.join(" · "))+'</div>':'')+
    '<div class="planilhas"><span class="rot">Planilhas das imobiliárias</span>'+(L.corretores||[]).map(c=>'<a class="btn peq" href="'+escA(c.url)+'" target="_blank" rel="noopener">'+escA(c.nome)+' ↗</a>').join("")+
      (L.planilhaMarketing?'<a class="btn peq" href="'+escA(L.planilhaMarketing)+(L.gidClientes!=null?'#gid='+L.gidClientes:'')+'" target="_blank" rel="noopener">LEADS CLIENTES ↗</a>':'')+'</div>'+
    '<div id="tabela-leads"></div>'+
    '<p class="dica" style="margin-top:10px">Clientes que a HyperFlow grava na planilha de atendimentos vão para a imobiliária escolhida (a linha entra na planilha dela com data, cliente, telefone, e-mail e observações; aqui marca "MANDOU PRA TABELA DE CORRETORES?" = SIM). O alerta da 1ª coluna conta o tempo desde o envio enquanto a coluna RETORNO DA IMOBILIÁRIA estiver vazia: amarelo depois de 1 dia, vermelho depois de 3. Leads novos da aba Site (desde '+fmtD("2026-11-24")+') vão só para o Hudson.</p></div>';
  $("#sec-red").innerHTML=h;
  desenharTabela();
}
function desenharTabela(){
  const lista=filtrados();
  const el=$("#tabela-leads"); if(!el) return;
  if(!lista.length){ el.innerHTML='<p class="vazio dica" style="padding:12px 2px">Nenhum lead neste filtro.</p>'; return; }
  el.innerHTML='<div class="tbl-wrap alta"><table class="tred"><thead><tr><th>Situação</th><th>Data/hora</th><th>Origem</th><th>Nome</th><th>Consent.</th><th>WhatsApp</th><th>E-mail</th><th>Faixa de renda / entrada</th><th>Profissão / objetivo</th><th>Preferência / parcela</th><th>Mandou p/ tabela?</th><th>Envio</th><th>Retorno da imobiliária</th></tr></thead><tbody>'+
    lista.map(l=>'<tr'+(l.tipo==="hudson"?' class="hud"':'')+'>'+
      '<td>'+statusLead(l)+'</td>'+
      '<td style="white-space:nowrap">'+fmtDH(l.t)+'</td>'+
      '<td><span class="origem'+(l.tipo==="hudson"?' site':'')+'" title="'+escA(l.origem)+'">'+escA(String(l.origem||"").replace(/\s*-\s*Reserva dos Ip[êe]s/i,""))+'</span>'+(l.tipo==="hudson"?'<br><span class="hudtag" style="margin-top:4px">→ HUDSON</span>':'')+'</td>'+
      '<td class="nome">'+escA(l.nome||"—")+'</td>'+
      '<td>'+escA(l.cons||"—")+'</td>'+
      '<td style="white-space:nowrap">'+(l.telCru?'<a href="https://wa.me/'+escA((l.telCru.length<=11?"55":"")+l.telCru)+'" target="_blank" rel="noopener">'+escA(l.tel)+'</a>':escA(l.tel||"—"))+'</td>'+
      '<td>'+escA(l.email||"—")+'</td>'+
      '<td>'+escA(l.tipo==="hudson"? (l.entrada?"Entrada "+l.entrada:"—") : (l.renda||"—"))+'</td>'+
      '<td>'+escA(l.tipo==="hudson"? (l.objetivo||"—") : (l.prof||"—"))+'</td>'+
      '<td>'+escA(l.tipo==="hudson"? (l.parcela?"Parcela "+l.parcela:"—") : (l.pref||"—"))+'</td>'+
      '<td>'+(l.tipo==="hudson"? '<span class="hudtag">só HUDSON</span>' : escA(l.mandou||(l.enviado?"SIM":"—")))+'</td>'+
      '<td>'+celulaEnvio(l,l.i)+'</td>'+
      '<td><div class="ret">'+(l.tipo==="hudson"?'<span class="muted">—</span>':escA(l.retorno||"")||'<span class="muted">vazio</span>')+'</div></td>'+
    '</tr>').join("")+'</tbody></table></div>';
}
function preEnviar(i){
  const sel=$("#dest-"+i); const destino=sel&&sel.value;
  if(!destino){ toast("Escolha a imobiliária.", true); sel&&sel.focus(); return; }
  ST.conf={i,destino}; desenharTabela();
}
async function enviar(i){
  if(ST.enviando||!ST.conf) return;
  const l=ST.L.itens[i]; ST.enviando=true; desenharTabela();
  const r=await api({ action:"mkEnviar", chave:l.chave, destino:ST.conf.destino });
  ST.enviando=false;
  if(!r.ok){ ST.conf=null; toast(msgErro(r.erro), true); desenharTabela(); return; }
  toast(l.nome+" enviado para "+r.destino+".");
  ST.conf=null; await carregarLeads(true);
}
async function confirmarHudson(idx){
  const chaves=idx.map(i=>ST.L.itens[i].chave);
  const r=await api({ action:"mkHudson", chaves });
  if(!r.ok){ toast(msgErro(r.erro), true); return; }
  toast(r.confirmados+(r.confirmados===1?" lead confirmado":" leads confirmados")+" como enviado ao Hudson.");
  ST.copiouHudson=false; await carregarLeads(true);
}
async function copiarHudson(){
  const pend=ST.L.itens.filter(l=>l.tipo==="hudson"&&!l.enviado);
  const txt="Leads do site — "+pend.length+"\n\n"+pend.map(textoLead).join("\n\n");
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(x){} ta.remove(); }
  ST.copiouHudson=true; toast("Copiado: "+pend.length+" leads. Cole no WhatsApp do Hudson e depois marque como enviados."); desenharLeads();
}
async function desfazer(i){
  const l=ST.L.itens[i];
  const r=await api({ action:"mkDesfazer", chave:l.chave });
  if(!r.ok){ toast(msgErro(r.erro), true); return; }
  toast(r.avisoPlanilha||"Registro apagado."); await carregarLeads(true);
}

/* ===================== início ===================== */
irPara(location.hash==="#red"?"red":"camp");
</script>
